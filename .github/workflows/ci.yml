name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: toolbox
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: toolbox
      - uses: actions/checkout@v7
        with:
          repository: joshuarli/shadowdriver
          path: shadowdriver
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.3.0
      - run: make fmtlint
      - run: make test
