[project]
name = "tool"
version = "0.1.0"
description = "various tools"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "blessed>=1.20",
    "mutagen>=1.48.1",
    "pyobjc-framework-cocoa>=11 ; sys_platform == 'darwin'",
    "urllib3>=2.7.0",
    "uvloop>=0.22.1",
    "websockets>=16.0",
]

[project.optional-dependencies]
browser = [
    "shadowdriver",
]

[project.scripts]
tool = "tool.cli:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.sources]
shadowdriver = { path = "../shadowdriver/py" }

[dependency-groups]
dev = [
    "joshuarli-pytest-parallel>=0.2.0",
    "maturin>=1.9,<2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16",
    "ty>=0.0.34",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
minversion = "8"
# Python 3.14 deprecates policy-era asyncio APIs. Current uvloop/pytest-asyncio
# integration still uses an EventLoopPolicy to run tests under uvloop, and
# stdlib asyncio.to_thread() currently trips uvloop's deprecated coroutine check
# internally. Keep these filters narrow so unrelated deprecations still surface.
filterwarnings = [
  "ignore:'asyncio\\.AbstractEventLoopPolicy' is deprecated and slated for removal in Python 3\\.16:DeprecationWarning:uvloop",
  "ignore:'asyncio\\.iscoroutinefunction' is deprecated and slated for removal in Python 3\\.16; use inspect\\.iscoroutinefunction\\(\\) instead:DeprecationWarning:asyncio\\.threads",
]

[tool.ty.environment]
root = ["src"]

[tool.ty.src]
include = ["src"]

[tool.ty.rules]
all = "error"
unresolved-import = "ignore"

[tool.ruff]
target-version = "py315"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins (shadowing builtins)
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "PIE",    # flake8-pie (misc lints)
    "C4",     # flake8-comprehensions
    "T20",    # flake8-print (flag print in library code)
    "TCH",    # flake8-type-checking (move imports to TYPE_CHECKING)
    "PERF",   # perflint
    "FURB",   # refurb
]
ignore = [
    "E501",
    "SIM105",
    "RUF001",
    "RUF002",
    "RUF003",
    "B904",
    "T201",   # allow print() — this is a CLI tool
    "RET505", # allow else-after-return for clarity
    "SIM108", # allow if/else over ternary when clearer
    "TCH",    # don't move imports to TYPE_CHECKING — not worth the complexity for a CLI
    "PT009",  # some suites use unittest.TestCase-style self.assertX on purpose
    "PT027",  # (same) unittest.TestCase-style self.assertRaises
    "PT019",  # false positive on unittest.mock.patch-injected parameters
]
